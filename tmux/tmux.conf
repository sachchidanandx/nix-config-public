# ==============================================
# Minimalistic Tmux Config with Catppuccin
# ==============================================

# ===== PLUGINS ===== #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'

# ===== GENERAL ===== #

# True color support
set-option -g default-terminal "tmux-256color"
set-option -s terminal-overrides ",xterm*:Tc,*:RGB"
# Extended keys (modifyOtherKeys/CSI-u) from the outer terminal: off for
# generic xterm*, on for Ghostty so modified keys such as ctrl+shift+tab
# reach apps (pi cycles plan/execute mode with it). Without it tmux gets
# legacy sequences that cannot carry ctrl+shift+tab.
set-option -as terminal-features ",xterm*:!extkeys,xterm-ghostty:extkeys"

# Fast escape time (important for nvim)
set-option -s escape-time 10
set-option -sg repeat-time 600
set-option -s focus-events on

# Mouse support
set-option -g mouse on

# History
set-option -g history-limit 50000

# Vi mode
set-option -g status-keys vi
set-option -g mode-keys vi

# Shell
set-option -g update-environment "PATH"
set -g default-command "zsh -i"

# Clipboard
set -g set-clipboard on

# Force tmux-yank to use the OSC 52 clipboard (works headless over SSH, no xclip/$DISPLAY needed)
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# SSH session
set -g allow-passthrough on

# ===== PREFIX ===== #

# Change prefix from C-b to M-a (Alt-a)
# unbind C-b
# set -g prefix M-a
# bind M-a send-prefix

# ===== CATPPUCCIN THEME ===== #

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_prefix_highlight true
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{pane_current_command}"

# Minimal status bar
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -g status-interval 5

# ===== DISPLAY ===== #

# Start numbering at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows
set-option -g renumber-windows on

# Auto rename windows
set-window-option -g automatic-rename on

# Terminal title
set-option -g set-titles on
set-option -g set-titles-string "#h ➜ #S #I #W"

# Activity
set-option -g monitor-activity on
set-option -g visual-activity off

# ===== NAVIGATION ===== #

# Session management
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# Window splits (open in same directory)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation
bind Tab last-window
bind -r C-h previous-window
bind -r C-l next-window

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ===== COPY MODE ===== #

bind Enter copy-mode

# Vi-style copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Incremental search
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# macOS clipboard integration
if-shell 'command -v pbcopy > /dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | pbcopy"'

# ===== QUICK COMMANDS ===== #

# Clear screen and history
bind -n C-k send-keys C-l \; run 'sleep 0.1' \; clear-history

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Edit config
bind e new-window -n "tmux.conf" "nvim ~/.config/tmux/tmux.conf"

# Kill commands
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind q kill-pane

# Toggle pane synchronization
bind S set-window-option synchronize-panes\; display "synchronize: #{?pane_synchronized,ON,OFF}"

# Maximize pane
bind z resize-pane -Z

# ===== Pi config ===== #
set -g extended-keys on
set -g extended-keys-format csi-u

# ===== AUTO INSTALL TPM ===== #

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
