# ============================================
# STARSHIP PROMPT CONFIGURATION
# Clean icon-focused design without background colors
# ============================================

"$schema" = 'https://starship.rs/config-schema.json'

# ============================================
# PERFORMANCE OPTIMIZATIONS
# ============================================
command_timeout = 100
scan_timeout = 30
add_newline = false

# ============================================
# COLOR PALETTE
# ============================================
palette = "catppuccin_macchiato"

# ============================================
# CHARACTER (Prompt Symbol)
# ============================================
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

# ============================================
# USER & SYSTEM
# ============================================
[username]
show_always = false
format = "[$user](bold blue) "

[hostname]
ssh_only = true
format = "[@$hostname](bold yellow) "

# ============================================
# DIRECTORY
# ============================================
[directory]
truncation_length = 4
# home_symbol = "󰋜 "
read_only = " 󰌾"
style = "bold lavender"

# ============================================
# GIT
# ============================================
[git_branch]
style = "bold mauve"

# ============================================
# CATPPUCCIN PALETTES
# ============================================

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
